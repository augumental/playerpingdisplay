plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
	id 'fabric-loom' version '1.18.2' apply false
	id 'maven-publish'
}

def targets = [
    '1.21.11': [fabric: '0.141.5+1.21.11', modmenu: '17.0.1-beta.1', yarn: '1.21.11+build.6', mod: '1.1.0'],
    '1.21': [fabric: '0.102.0+1.21', modmenu: '11.0.5', yarn: '1.21+build.9'],
    '1.21.1': [fabric: '0.116.17+1.21.1', modmenu: '11.0.5', yarn: '1.21.1+build.3'],
    '1.21.4': [fabric: '0.119.4+1.21.4', modmenu: '13.0.4', yarn: '1.21.4+build.8'],
    '1.21.8': [fabric: '0.136.1+1.21.8', modmenu: '15.0.2', yarn: '1.21.8+build.1'],
    '26.1': [fabric: '0.145.1+26.1', modmenu: '18.0.2'],
    '26.2': [fabric: '0.161.0+26.2', modmenu: '20.0.3'],
    '26.3': [fabric: '0.161.0+26.3', modmenu: '21.0.0']
]
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def target = targets[minecraftVersion]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version: ${minecraftVersion}. Choose ${targets.keySet()}.")
}
def legacy = target.containsKey('yarn')
def javaVersion = legacy ? 21 : 25
apply plugin: legacy ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

version = "${target.mod ?: project.mod_version}+mc${minecraftVersion}"
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraftVersion}")
tasks.named('clean', Delete) {
    setDelete(layout.buildDirectory)
}
group = project.maven_group

// Minecraft moved screen and HUD state into Gui in 26.2.
sourceSets.main.java.setSrcDirs(minecraftVersion == '1.21.11' ? ['src/mc1.21.11/java'] : legacy
        ? ['src/main/java', 'src/mc1.21/java']
        : ['src/main/java', 'src/mc26/java', minecraftVersion == '26.1' ? 'src/mc26.1/java' : 'src/mc26.2/java'])

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (legacy) {
		mappings "net.fabricmc:yarn:${target.yarn}:v2"
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabric}"
		modCompileOnly "maven.modrinth:modmenu:${target.modmenu}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${target.fabric}"
		compileOnly "maven.modrinth:modmenu:${target.modmenu}"
	}
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', minecraftVersion
	inputs.property 'loader_version', project.loader_version
	inputs.property 'modmenu_version', target.modmenu
	inputs.property 'java_version', javaVersion
	inputs.property 'mod_description', minecraftVersion == '1.21.11'
			? "Shows a targeted player's live ping after you hit them, with a customizable HUD."
			: "Shows a targeted player's live ping for five seconds after you hit them."

	filesMatching('fabric.mod.json') {
		expand inputs.properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
