plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.2'
	id 'maven-publish'
}

def targets = [
    '26.1': [fabric: '0.145.1+26.1', modmenu: '18.0.2'],
    '26.2': [fabric: '0.161.0+26.2', modmenu: '20.0.3'],
    '26.3': [fabric: '0.161.0+26.3', modmenu: '21.0.0']
]
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def target = targets[minecraftVersion]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version: ${minecraftVersion}. Choose ${targets.keySet()}.")
}
version = "${project.mod_version}+mc${minecraftVersion}"
layout.buildDirectory = layout.projectDirectory.dir("build/${minecraftVersion}")
tasks.named('clean', Delete) {
    setDelete(layout.buildDirectory)
}
group = project.maven_group

// Minecraft moved screen and HUD state into Gui in 26.2.
sourceSets.main.java.srcDir(minecraftVersion == '26.1' ? 'src/mc26.1/java' : 'src/mc26.2/java')

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${target.fabric}"
	compileOnly "maven.modrinth:modmenu:${target.modmenu}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', minecraftVersion
	inputs.property 'loader_version', project.loader_version
	inputs.property 'modmenu_version', target.modmenu

	filesMatching('fabric.mod.json') {
		expand inputs.properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property 'archivesName', project.base.archivesName

	from('LICENSE') {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
