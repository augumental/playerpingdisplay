name: Build Fabric ports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.4', '1.21.8', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash gradlew build -Pminecraft_version=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: playerpingdisplay-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error

  customization-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.4', '1.21.8', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    env:
      SDL_VIDEO_FORCE_EGL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software OpenGL libraries for SDL
        if: matrix.minecraft == '26.3'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-dev libegl-mesa0 libgl1-mesa-dri
      - name: Run customization and U shortcut checks
        run: xvfb-run -a bash gradlew -I tests/smoke.init.gradle -Pminecraft_version=${{ matrix.minecraft }} runClient
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customization-smoke-mc${{ matrix.minecraft }}
          path: run/customization-smoke-${{ matrix.minecraft }}/screenshots/*.png
