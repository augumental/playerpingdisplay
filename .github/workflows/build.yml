name: Build Fabric ports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.4', '1.21.8', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash gradlew build -Pminecraft_version=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: playerpingdisplay-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error

  customization-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Minecraft 1.21.11 customization checks
        run: xvfb-run -a bash gradlew -I tests/1.21.11/smoke.init.gradle -Pminecraft_version=1.21.11 runClient
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customization-smoke-screenshots
          path: run/customization-smoke/screenshots/*.png
