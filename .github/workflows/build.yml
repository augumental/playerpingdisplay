name: Build Fabric ports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.4', '1.21.8', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash gradlew build -Pminecraft_version=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: playerpingdisplay-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error
